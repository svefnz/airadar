# 说明: 仓库为私有时 GitHub Pages(免费计划)不可用。
# 本工作流只负责「校验 + 构建」；站点部署使用 Cloudflare Pages(免费, 支持私有仓库):
#   连接仓库 → 框架预设 Astro → 构建命令 pnpm install --frozen-lockfile && pnpm build
#   → 输出目录 dist → 环境变量 NODE_VERSION=22
name: CI (校验+构建)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # base 自动推导: 仓库 Variables 可覆盖(vars.ASTRO_BASE)
  # - 仓库名形如 <user>.github.io(用户主页) → '/'
  # - 其他仓库名(项目站点) → '/<repo>/'
  ASTRO_BASE: ${{ vars.ASTRO_BASE || (endsWith(github.event.repository.name, '.github.io') && '/') || format('/{0}/', github.event.repository.name) }}
  SITE_URL: ${{ vars.SITE_URL || (endsWith(github.event.repository.name, '.github.io') && format('https://{0}/', github.event.repository.name)) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Astro types
        run: pnpm exec astro sync

      - name: TypeScript check
        run: pnpm check

      - name: Data schema & business validation
        run: pnpm validate

      - name: Duplicate check
        run: pnpm check-duplicates

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # 部署交由 Cloudflare Pages(见 README「Cloudflare 部署」)。
  # 若以后将仓库转为公开, 取消注释下方任务即可启用 GitHub Pages:
