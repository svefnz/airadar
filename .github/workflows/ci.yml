name: CI / Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [supabase-db-update, radar-update]

# 最小权限: 仅 pages 与 id-token 用于部署; contents 只读
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # base 自动推导: 仓库 Variables 可覆盖(vars.ASTRO_BASE)
  # - 仓库名形如 <user>.github.io(用户主页) → '/'
  # - 其他仓库名(项目站点) → '/<repo>/'
  ASTRO_BASE: ${{ vars.ASTRO_BASE || (endsWith(github.event.repository.name, '.github.io') && '/') || format('/{0}/', github.event.repository.name) }}
  SITE_URL: ${{ vars.SITE_URL || (endsWith(github.event.repository.name, '.github.io') && format('https://{0}/', github.event.repository.name)) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
  PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY || vars.PUBLIC_SUPABASE_ANON_KEY }}
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY || vars.PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Astro types
        run: pnpm exec astro sync

      - name: TypeScript check
        run: pnpm check

      - name: Sync latest radar data from Supabase
        run: pnpm exec tsx scripts/sync-radar-from-supabase.ts

      - name: Data schema & business validation
        run: pnpm validate

      - name: Duplicate check
        run: pnpm check-duplicates

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
